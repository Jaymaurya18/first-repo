{% extends "base.html" %}
{% block content %}
<h1>Ask the AI</h1>
<form method="POST">
    <textarea name="question" rows="5" placeholder="Ask about programming, AI, topics..." required></textarea><br>
    <button type="submit">Ask</button>
</form>

{% if answer %}
<div class="card result">
    <h3>Answer</h3>
    <p>{{ answer }}</p>
</div>
{% endif %}
{% endblock %}
